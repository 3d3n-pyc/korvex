<svg xmlns="http://www.w3.org/2000/svg" width="760" height="452" viewBox="0 0 760 452" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img">
<title>Requests per second per framework on one CPU core, higher is better</title>
<desc>Best case, 200 clients: Korvex: 31,869; Falcon: 31,549; Starlette: 31,080; Litestar: 18,179; Sanic: 15,793; FastAPI: 12,868; BlackSheep: 7,019; Django: 2,387.</desc>
<rect width="760" height="452" rx="8" fill="#1a1a19"/>
<text x="20" y="32" font-size="16" font-weight="600" fill="#f0efec">Requests per second on one CPU core (higher is better)</text>
<text x="20" y="54" font-size="12" fill="#c3c2b7">Same app and server for all (uvicorn, 1 worker, 1,000 routes), 200 clients, random URLs. No request failed.</text>
<circle cx="25" cy="78" r="5" fill="#9ec5f4"/>
<text x="35" y="82" font-size="12" fill="#c3c2b7">Best case</text>
<circle cx="114.4" cy="78" r="5" fill="#184f95"/>
<text x="124.4" y="82" font-size="12" fill="#c3c2b7">Worst case: route declared after the 1,000 others</text>
<line x1="190.0" y1="96" x2="190.0" y2="352" stroke="#2c2c2a" stroke-width="1"/>
<text x="190.0" y="370" font-size="11" text-anchor="middle" fill="#898781">0</text>
<line x1="305.0" y1="96" x2="305.0" y2="352" stroke="#2c2c2a" stroke-width="1"/>
<text x="305.0" y="370" font-size="11" text-anchor="middle" fill="#898781">10k</text>
<line x1="420.0" y1="96" x2="420.0" y2="352" stroke="#2c2c2a" stroke-width="1"/>
<text x="420.0" y="370" font-size="11" text-anchor="middle" fill="#898781">20k</text>
<line x1="535.0" y1="96" x2="535.0" y2="352" stroke="#2c2c2a" stroke-width="1"/>
<text x="535.0" y="370" font-size="11" text-anchor="middle" fill="#898781">30k</text>
<line x1="650.0" y1="96" x2="650.0" y2="352" stroke="#2c2c2a" stroke-width="1"/>
<text x="650.0" y="370" font-size="11" text-anchor="middle" fill="#898781">40k</text>
<line x1="190" y1="352" x2="650" y2="352" stroke="#383835" stroke-width="1"/>
<text x="20" y="116" font-size="13" font-weight="600" fill="#f0efec">Korvex</text>
<circle cx="556.5" cy="112" r="5" fill="#9ec5f4" stroke="#1a1a19" stroke-width="2"/>
<text x="666" y="116" font-size="12" font-weight="600" fill="#f0efec">31.9k</text>
<text x="20" y="146" font-size="13" fill="#c3c2b7">Falcon</text>
<circle cx="552.8" cy="142" r="5" fill="#9ec5f4" stroke="#1a1a19" stroke-width="2"/>
<text x="666" y="146" font-size="12" fill="#c3c2b7">31.5k</text>
<text x="20" y="176" font-size="13" fill="#c3c2b7">Starlette</text>
<line x1="223.2" y1="172" x2="547.4" y2="172" stroke="#383835" stroke-width="2" stroke-linecap="round"/>
<circle cx="223.2" cy="172" r="5" fill="#184f95" stroke="#1a1a19" stroke-width="2"/>
<circle cx="547.4" cy="172" r="5" fill="#9ec5f4" stroke="#1a1a19" stroke-width="2"/>
<text x="666" y="176" font-size="12" fill="#c3c2b7">2.9k to 31.1k</text>
<text x="20" y="206" font-size="13" fill="#c3c2b7">Litestar</text>
<circle cx="399.1" cy="202" r="5" fill="#9ec5f4" stroke="#1a1a19" stroke-width="2"/>
<text x="666" y="206" font-size="12" fill="#c3c2b7">18.2k</text>
<text x="20" y="236" font-size="13" fill="#c3c2b7">Sanic</text>
<circle cx="371.6" cy="232" r="5" fill="#9ec5f4" stroke="#1a1a19" stroke-width="2"/>
<text x="666" y="236" font-size="12" fill="#c3c2b7">15.8k</text>
<text x="20" y="266" font-size="13" fill="#c3c2b7">FastAPI</text>
<line x1="206.9" y1="262" x2="338.0" y2="262" stroke="#383835" stroke-width="2" stroke-linecap="round"/>
<circle cx="206.9" cy="262" r="5" fill="#184f95" stroke="#1a1a19" stroke-width="2"/>
<circle cx="338.0" cy="262" r="5" fill="#9ec5f4" stroke="#1a1a19" stroke-width="2"/>
<text x="666" y="266" font-size="12" fill="#c3c2b7">1.5k to 12.9k</text>
<text x="20" y="296" font-size="13" fill="#c3c2b7">BlackSheep</text>
<circle cx="270.7" cy="292" r="5" fill="#184f95" stroke="#1a1a19" stroke-width="2"/>
<text x="666" y="296" font-size="12" fill="#c3c2b7">7.0k</text>
<text x="20" y="326" font-size="13" fill="#c3c2b7">Django</text>
<line x1="202.9" y1="322" x2="217.5" y2="322" stroke="#383835" stroke-width="2" stroke-linecap="round"/>
<circle cx="202.9" cy="322" r="5" fill="#184f95" stroke="#1a1a19" stroke-width="2"/>
<circle cx="217.5" cy="322" r="5" fill="#9ec5f4" stroke="#1a1a19" stroke-width="2"/>
<text x="666" y="326" font-size="12" fill="#c3c2b7">1.1k to 2.4k</text>
<text x="20" y="398" font-size="12" fill="#c3c2b7">Starlette, FastAPI and Django try routes one by one, so the route&#8217;s position matters.</text>
<text x="20" y="416" font-size="12" fill="#c3c2b7">BlackSheep does too, but sorts routes itself: here the tested route always comes last.</text>
<text x="20" y="436" font-size="11" fill="#898781">Python 3.14.7, 11th Gen Intel(R) Core(TM) i7-11800H @ 2.30GHz</text>
</svg>
