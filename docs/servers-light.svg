<text x="190.0" y="250" font-size="11" text-anchor="middle" fill="#898781">0</text>
<line x1="255.7" y1="96" x2="255.7" y2="232" stroke="#e1e0d9" stroke-width="1"/>
<text x="255.7" y="250" font-size="11" text-anchor="middle" fill="#898781">20k</text>
<line x1="321.4" y1="96" x2="321.4" y2="232" stroke="#e1e0d9" stroke-width="1"/>
<text x="321.4" y="250" font-size="11" text-anchor="middle" fill="#898781">40k</text>
