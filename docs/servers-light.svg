<svg xmlns="http://www.w3.org/2000/svg" width="760" height="314" viewBox="0 0 760 314" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img">
<title>Requests per second per server on the same 4 CPU cores, higher is better</title>
<desc>Korvex (built-in): 126,378 with 200 clients, 130,549 with 1,000; Granian + Korvex app: 111,560 with 200 clients, 113,371 with 1,000; uvicorn + Korvex app: 105,024 with 200 clients, 96,295 with 1,000; Robyn: 90,279 with 200 clients, 81,851 with 1,000.</desc>
<rect width="760" height="314" rx="8" fill="#fcfcfb"/>
<text x="20" y="32" font-size="16" font-weight="600" fill="#0b0b0b">Requests per second on the same 4 CPU cores (higher is better)</text>
<text x="20" y="54" font-size="12" fill="#52514e">Same app for all, each server with its best worker count. No request failed.</text>
<circle cx="25" cy="78" r="5" fill="#86b6ef"/>
<text x="35" y="82" font-size="12" fill="#52514e">200 clients</text>
<circle cx="127.6" cy="78" r="5" fill="#104281"/>
<text x="137.6" y="82" font-size="12" fill="#52514e">1,000 clients</text>
