<text x="321.4" y="280" font-size="11" text-anchor="middle" fill="#898781">40k</text>
<line x1="387.1" y1="96" x2="387.1" y2="262" stroke="#e1e0d9" stroke-width="1"/>
<text x="387.1" y="280" font-size="11" text-anchor="middle" fill="#898781">60k</text>
<line x1="452.9" y1="96" x2="452.9" y2="262" stroke="#e1e0d9" stroke-width="1"/>
<text x="452.9" y="280" font-size="11" text-anchor="middle" fill="#898781">80k</text>
<line x1="518.6" y1="96" x2="518.6" y2="262" stroke="#e1e0d9" stroke-width="1"/>
<text x="518.6" y="280" font-size="11" text-anchor="middle" fill="#898781">100k</text>
<line x1="584.3" y1="96" x2="584.3" y2="262" stroke="#e1e0d9" stroke-width="1"/>
<text x="584.3" y="280" font-size="11" text-anchor="middle" fill="#898781">120k</text>
