<circle cx="491.3" cy="202" r="5" fill="#104281" stroke="#fcfcfb" stroke-width="2"/>
<text x="666" y="206" font-size="12" fill="#52514e">95.7k / 91.7k</text>
<text x="20" y="236" font-size="13" fill="#52514e">FastrAPI</text>
<line x1="391.7" y1="232" x2="410.6" y2="232" stroke="#c3c2b7" stroke-width="2" stroke-linecap="round"/>
<circle cx="391.7" cy="232" r="5" fill="#86b6ef" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="410.6" cy="232" r="5" fill="#104281" stroke="#fcfcfb" stroke-width="2"/>
<text x="666" y="236" font-size="12" fill="#52514e">61.4k / 67.1k</text>
<text x="20" y="308" font-size="12" fill="#52514e">uvicorn and Granian run the Korvex ASGI app; Robyn and FastrAPI run their own version with their own server.</text>
<text x="20" y="328" font-size="11" fill="#898781">Python 3.14.7, 11th Gen Intel(R) Core(TM) i7-11800H @ 2.30GHz</text>
