<line x1="190" y1="232" x2="650" y2="232" stroke="#c3c2b7" stroke-width="1"/>
<text x="20" y="116" font-size="13" font-weight="600" fill="#0b0b0b">Korvex (built-in)</text>
<line x1="605.2" y1="112" x2="618.9" y2="112" stroke="#c3c2b7" stroke-width="2" stroke-linecap="round"/>
<circle cx="605.2" cy="112" r="5" fill="#86b6ef" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="618.9" cy="112" r="5" fill="#104281" stroke="#fcfcfb" stroke-width="2"/>
<text x="666" y="116" font-size="12" font-weight="600" fill="#0b0b0b">126.4k / 130.5k</text>
<text x="20" y="146" font-size="13" fill="#52514e">Granian + Korvex app</text>
<line x1="556.6" y1="142" x2="562.5" y2="142" stroke="#c3c2b7" stroke-width="2" stroke-linecap="round"/>
<circle cx="556.6" cy="142" r="5" fill="#86b6ef" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="562.5" cy="142" r="5" fill="#104281" stroke="#fcfcfb" stroke-width="2"/>
<text x="666" y="146" font-size="12" fill="#52514e">111.6k / 113.4k</text>
<text x="20" y="176" font-size="13" fill="#52514e">uvicorn + Korvex app</text>
<line x1="506.4" y1="172" x2="535.1" y2="172" stroke="#c3c2b7" stroke-width="2" stroke-linecap="round"/>
<circle cx="535.1" cy="172" r="5" fill="#86b6ef" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="506.4" cy="172" r="5" fill="#104281" stroke="#fcfcfb" stroke-width="2"/>
<text x="666" y="176" font-size="12" fill="#52514e">105.0k / 96.3k</text>
