<circle cx="458.9" cy="202" r="5" fill="#104281" stroke="#fcfcfb" stroke-width="2"/>
<text x="666" y="206" font-size="12" fill="#52514e">90.3k / 81.9k</text>
<text x="20" y="278" font-size="12" fill="#52514e">uvicorn and Granian run the Korvex ASGI app; Robyn runs its own version with its own server.</text>
<text x="20" y="298" font-size="11" fill="#898781">Python 3.14.7, 11th Gen Intel(R) Core(TM) i7-11800H @ 2.30GHz</text>
