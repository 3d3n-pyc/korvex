<text x="650.0" y="280" font-size="11" text-anchor="middle" fill="#898781">140k</text>
<line x1="190" y1="262" x2="650" y2="262" stroke="#c3c2b7" stroke-width="1"/>
<text x="20" y="116" font-size="13" font-weight="600" fill="#0b0b0b">Korvex (built-in)</text>
<line x1="658.8" y1="112" x2="667.9" y2="112" stroke="#c3c2b7" stroke-width="2" stroke-linecap="round"/>
<circle cx="658.8" cy="112" r="5" fill="#86b6ef" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="667.9" cy="112" r="5" fill="#104281" stroke="#fcfcfb" stroke-width="2"/>
<text x="666" y="116" font-size="12" font-weight="600" fill="#0b0b0b">142.7k / 145.4k</text>
<text x="20" y="146" font-size="13" fill="#52514e">Granian + Korvex app</text>
<line x1="597.0" y1="142" x2="630.5" y2="142" stroke="#c3c2b7" stroke-width="2" stroke-linecap="round"/>
<circle cx="597.0" cy="142" r="5" fill="#86b6ef" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="630.5" cy="142" r="5" fill="#104281" stroke="#fcfcfb" stroke-width="2"/>
<text x="666" y="146" font-size="12" fill="#52514e">123.9k / 134.1k</text>
<text x="20" y="176" font-size="13" fill="#52514e">uvicorn + Korvex app</text>
<line x1="552.8" y1="172" x2="575.9" y2="172" stroke="#c3c2b7" stroke-width="2" stroke-linecap="round"/>
