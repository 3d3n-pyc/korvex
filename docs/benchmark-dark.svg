<svg xmlns="http://www.w3.org/2000/svg" width="760" height="532" viewBox="0 0 760 532" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img">
<title>Route lookup time per router, log scale, lower is better</title>
<desc>Median time per lookup with 10,000 routes. Korvex: 347 ns; Litestar: 732 ns; Sanic: 3.5 µs; Flask: 3.5 µs; Django: 1.3 ms; Starlette / FastAPI: 1.5 ms; Korvex cached: 67 ns; Litestar cached: 92 ns; Sanic cached: 211 ns.</desc>
<rect width="760" height="532" rx="8" fill="#1a1a19"/>
<text x="20" y="32" font-size="16" font-weight="600" fill="#f0efec">Time per route lookup (lower is better, log scale)</text>
<text x="20" y="54" font-size="12" fill="#c3c2b7">Median time per lookup. Every lookup is checked to find the right route.</text>
<circle cx="25" cy="78" r="5" fill="#184f95"/>
<text x="35" y="82" font-size="12" fill="#c3c2b7">100 routes</text>
<circle cx="121" cy="78" r="5" fill="#3987e5"/>
<text x="131" y="82" font-size="12" fill="#c3c2b7">1,000 routes</text>
<circle cx="231" cy="78" r="5" fill="#9ec5f4"/>
<text x="241" y="82" font-size="12" fill="#c3c2b7">10,000 routes</text>
<line x1="190.0" y1="100" x2="190.0" y2="450" stroke="#2c2c2a" stroke-width="1"/>
<text x="190.0" y="468" font-size="11" text-anchor="middle" fill="#898781">10 ns</text>
<line x1="266.7" y1="100" x2="266.7" y2="450" stroke="#2c2c2a" stroke-width="1"/>
<text x="266.7" y="468" font-size="11" text-anchor="middle" fill="#898781">100 ns</text>
<line x1="343.3" y1="100" x2="343.3" y2="450" stroke="#2c2c2a" stroke-width="1"/>
<text x="343.3" y="468" font-size="11" text-anchor="middle" fill="#898781">1 µs</text>
<line x1="420.0" y1="100" x2="420.0" y2="450" stroke="#2c2c2a" stroke-width="1"/>
<text x="420.0" y="468" font-size="11" text-anchor="middle" fill="#898781">10 µs</text>
<line x1="496.7" y1="100" x2="496.7" y2="450" stroke="#2c2c2a" stroke-width="1"/>
<text x="496.7" y="468" font-size="11" text-anchor="middle" fill="#898781">100 µs</text>
<line x1="573.3" y1="100" x2="573.3" y2="450" stroke="#2c2c2a" stroke-width="1"/>
<text x="573.3" y="468" font-size="11" text-anchor="middle" fill="#898781">1 ms</text>
<line x1="650.0" y1="100" x2="650.0" y2="450" stroke="#2c2c2a" stroke-width="1"/>
<text x="650.0" y="468" font-size="11" text-anchor="middle" fill="#898781">10 ms</text>
<line x1="190" y1="450" x2="650" y2="450" stroke="#383835" stroke-width="1"/>
<text x="20" y="108" font-size="12" font-weight="600" fill="#c3c2b7">Actual matching (no cache)</text>
<text x="32" y="134" font-size="13" font-weight="600" fill="#f0efec">Korvex</text>
<line x1="308.1" y1="130" x2="310.1" y2="130" stroke="#383835" stroke-width="2" stroke-linecap="round"/>
<circle cx="308.7" cy="130" r="5" fill="#184f95" stroke="#1a1a19" stroke-width="2"/>
<circle cx="310.1" cy="130" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
<circle cx="308.1" cy="130" r="5" fill="#9ec5f4" stroke="#1a1a19" stroke-width="2"/>
<text x="666" y="134" font-size="12" font-weight="600" fill="#f0efec">347 ns</text>
<text x="32" y="164" font-size="13" fill="#c3c2b7">Litestar</text>
<line x1="333.0" y1="160" x2="335.6" y2="160" stroke="#383835" stroke-width="2" stroke-linecap="round"/>
<circle cx="335.6" cy="160" r="5" fill="#184f95" stroke="#1a1a19" stroke-width="2"/>
<circle cx="335.6" cy="160" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
<circle cx="333.0" cy="160" r="5" fill="#9ec5f4" stroke="#1a1a19" stroke-width="2"/>
<text x="666" y="164" font-size="12" fill="#c3c2b7">732 ns</text>
<text x="32" y="194" font-size="13" fill="#c3c2b7">Sanic</text>
<line x1="353.1" y1="190" x2="385.3" y2="190" stroke="#383835" stroke-width="2" stroke-linecap="round"/>
<circle cx="353.1" cy="190" r="5" fill="#184f95" stroke="#1a1a19" stroke-width="2"/>
<circle cx="359.3" cy="190" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
<circle cx="385.3" cy="190" r="5" fill="#9ec5f4" stroke="#1a1a19" stroke-width="2"/>
<text x="666" y="194" font-size="12" fill="#c3c2b7">3.5 µs</text>
<text x="32" y="224" font-size="13" fill="#c3c2b7">Flask</text>
<line x1="380.1" y1="220" x2="387.2" y2="220" stroke="#383835" stroke-width="2" stroke-linecap="round"/>
<circle cx="380.1" cy="220" r="5" fill="#184f95" stroke="#1a1a19" stroke-width="2"/>
<circle cx="387.2" cy="220" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
<circle cx="385.4" cy="220" r="5" fill="#9ec5f4" stroke="#1a1a19" stroke-width="2"/>
<text x="666" y="224" font-size="12" fill="#c3c2b7">3.5 µs</text>
<text x="32" y="254" font-size="13" fill="#c3c2b7">Django</text>
<line x1="425.5" y1="250" x2="583.2" y2="250" stroke="#383835" stroke-width="2" stroke-linecap="round"/>
<circle cx="425.5" cy="250" r="5" fill="#184f95" stroke="#1a1a19" stroke-width="2"/>
<circle cx="493.3" cy="250" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
<circle cx="583.2" cy="250" r="5" fill="#9ec5f4" stroke="#1a1a19" stroke-width="2"/>
<text x="666" y="254" font-size="12" fill="#c3c2b7">1.3 ms</text>
<text x="32" y="284" font-size="13" fill="#c3c2b7">Starlette / FastAPI</text>
<line x1="435.0" y1="280" x2="586.6" y2="280" stroke="#383835" stroke-width="2" stroke-linecap="round"/>
<circle cx="435.0" cy="280" r="5" fill="#184f95" stroke="#1a1a19" stroke-width="2"/>
<circle cx="511.0" cy="280" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
<circle cx="586.6" cy="280" r="5" fill="#9ec5f4" stroke="#1a1a19" stroke-width="2"/>
<text x="666" y="284" font-size="12" fill="#c3c2b7">1.5 ms</text>
<text x="20" y="326" font-size="12" font-weight="600" fill="#c3c2b7">Same URLs repeated (router's own LRU cache)</text>
<text x="32" y="352" font-size="13" font-weight="600" fill="#f0efec">Korvex</text>
<line x1="252.7" y1="348" x2="253.9" y2="348" stroke="#383835" stroke-width="2" stroke-linecap="round"/>
<circle cx="253.9" cy="348" r="5" fill="#184f95" stroke="#1a1a19" stroke-width="2"/>
<circle cx="252.7" cy="348" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
<circle cx="253.4" cy="348" r="5" fill="#9ec5f4" stroke="#1a1a19" stroke-width="2"/>
<text x="666" y="352" font-size="12" font-weight="600" fill="#f0efec">67 ns</text>
<text x="32" y="382" font-size="13" fill="#c3c2b7">Litestar</text>
<line x1="263.0" y1="378" x2="263.8" y2="378" stroke="#383835" stroke-width="2" stroke-linecap="round"/>
<circle cx="263.0" cy="378" r="5" fill="#184f95" stroke="#1a1a19" stroke-width="2"/>
<circle cx="263.1" cy="378" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
<circle cx="263.8" cy="378" r="5" fill="#9ec5f4" stroke="#1a1a19" stroke-width="2"/>
<text x="666" y="382" font-size="12" fill="#c3c2b7">92 ns</text>
<text x="32" y="412" font-size="13" fill="#c3c2b7">Sanic</text>
<line x1="290.6" y1="408" x2="291.5" y2="408" stroke="#383835" stroke-width="2" stroke-linecap="round"/>
<circle cx="290.6" cy="408" r="5" fill="#184f95" stroke="#1a1a19" stroke-width="2"/>
<circle cx="291.5" cy="408" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
<circle cx="291.5" cy="408" r="5" fill="#9ec5f4" stroke="#1a1a19" stroke-width="2"/>
<text x="666" y="412" font-size="12" fill="#c3c2b7">211 ns</text>
<text x="20" y="496" font-size="12" fill="#c3c2b7">A single dot means the three overlap: lookup time doesn't grow with the number of routes.</text>
<text x="20" y="516" font-size="11" fill="#898781">Python 3.14.7, 11th Gen Intel(R) Core(TM) i7-11800H @ 2.30GHz</text>
<text x="666" y="98" font-size="11" fill="#898781">at 10,000</text>
</svg>
