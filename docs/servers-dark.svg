<text x="650.0" y="280" font-size="11" text-anchor="middle" fill="#898781">140k</text>
<line x1="190" y1="262" x2="650" y2="262" stroke="#383835" stroke-width="1"/>
<text x="20" y="116" font-size="13" font-weight="600" fill="#f0efec">Korvex (built-in)</text>
<line x1="555.6" y1="112" x2="568.6" y2="112" stroke="#383835" stroke-width="2" stroke-linecap="round"/>
<circle cx="555.6" cy="112" r="5" fill="#184f95" stroke="#1a1a19" stroke-width="2"/>
<circle cx="568.6" cy="112" r="5" fill="#9ec5f4" stroke="#1a1a19" stroke-width="2"/>
<text x="666" y="116" font-size="12" font-weight="600" fill="#f0efec">111.3k / 115.2k</text>
<text x="20" y="146" font-size="13" fill="#c3c2b7">Granian + Korvex app</text>
<line x1="538.3" y1="142" x2="564.7" y2="142" stroke="#383835" stroke-width="2" stroke-linecap="round"/>
