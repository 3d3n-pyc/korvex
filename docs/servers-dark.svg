<circle cx="471.2" cy="202" r="5" fill="#9ec5f4" stroke="#1a1a19" stroke-width="2"/>
<text x="666" y="206" font-size="12" fill="#c3c2b7">94.3k / 85.6k</text>
<text x="20" y="236" font-size="13" fill="#c3c2b7">FastrAPI</text>
<line x1="386.0" y1="232" x2="400.0" y2="232" stroke="#383835" stroke-width="2" stroke-linecap="round"/>
<circle cx="386.0" cy="232" r="5" fill="#184f95" stroke="#1a1a19" stroke-width="2"/>
<circle cx="400.0" cy="232" r="5" fill="#9ec5f4" stroke="#1a1a19" stroke-width="2"/>
<text x="666" y="236" font-size="12" fill="#c3c2b7">59.7k / 63.9k</text>
<text x="20" y="308" font-size="12" fill="#c3c2b7">uvicorn and Granian run the Korvex ASGI app; Robyn and FastrAPI run their own version with their own server.</text>
<text x="20" y="328" font-size="11" fill="#898781">Python 3.14.7, 11th Gen Intel(R) Core(TM) i7-11800H @ 2.30GHz</text>
