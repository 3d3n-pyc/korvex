<svg xmlns="http://www.w3.org/2000/svg" width="760" height="344" viewBox="0 0 760 344" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img">
<title>Requests per second per server on the same 4 CPU cores, higher is better</title>
<desc>Korvex (built-in): 127,050 with 200 clients, 131,879 with 1,000; Granian + Korvex app: 121,297 with 200 clients, 123,101 with 1,000; uvicorn + Korvex app: 109,141 with 200 clients, 104,299 with 1,000; Robyn: 96,630 with 200 clients, 91,715 with 1,000; FastrAPI: 60,783 with 200 clients, 69,323 with 1,000.</desc>
<rect width="760" height="344" rx="8" fill="#1a1a19"/>
<text x="20" y="32" font-size="16" font-weight="600" fill="#f0efec">Requests per second on the same 4 CPU cores (higher is better)</text>
<text x="20" y="54" font-size="12" fill="#c3c2b7">Same app for all, each server with its best worker count. No request failed.</text>
<circle cx="25" cy="78" r="5" fill="#184f95"/>
<text x="35" y="82" font-size="12" fill="#c3c2b7">200 clients</text>
<circle cx="127.6" cy="78" r="5" fill="#9ec5f4"/>
<text x="137.6" y="82" font-size="12" fill="#c3c2b7">1,000 clients</text>
<line x1="190.0" y1="96" x2="190.0" y2="262" stroke="#2c2c2a" stroke-width="1"/>
<text x="190.0" y="280" font-size="11" text-anchor="middle" fill="#898781">0</text>
<line x1="255.7" y1="96" x2="255.7" y2="262" stroke="#2c2c2a" stroke-width="1"/>
<text x="255.7" y="280" font-size="11" text-anchor="middle" fill="#898781">20k</text>
<line x1="321.4" y1="96" x2="321.4" y2="262" stroke="#2c2c2a" stroke-width="1"/>
<text x="321.4" y="280" font-size="11" text-anchor="middle" fill="#898781">40k</text>
<line x1="387.1" y1="96" x2="387.1" y2="262" stroke="#2c2c2a" stroke-width="1"/>
<text x="387.1" y="280" font-size="11" text-anchor="middle" fill="#898781">60k</text>
<line x1="452.9" y1="96" x2="452.9" y2="262" stroke="#2c2c2a" stroke-width="1"/>
<text x="452.9" y="280" font-size="11" text-anchor="middle" fill="#898781">80k</text>
<line x1="518.6" y1="96" x2="518.6" y2="262" stroke="#2c2c2a" stroke-width="1"/>
<text x="518.6" y="280" font-size="11" text-anchor="middle" fill="#898781">100k</text>
<line x1="584.3" y1="96" x2="584.3" y2="262" stroke="#2c2c2a" stroke-width="1"/>
<text x="584.3" y="280" font-size="11" text-anchor="middle" fill="#898781">120k</text>
<line x1="650.0" y1="96" x2="650.0" y2="262" stroke="#2c2c2a" stroke-width="1"/>
<text x="650.0" y="280" font-size="11" text-anchor="middle" fill="#898781">140k</text>
<line x1="190" y1="262" x2="650" y2="262" stroke="#383835" stroke-width="1"/>
<text x="20" y="116" font-size="13" font-weight="600" fill="#f0efec">Korvex (built-in)</text>
<line x1="607.4" y1="112" x2="623.3" y2="112" stroke="#383835" stroke-width="2" stroke-linecap="round"/>
<circle cx="607.4" cy="112" r="5" fill="#184f95" stroke="#1a1a19" stroke-width="2"/>
<circle cx="623.3" cy="112" r="5" fill="#9ec5f4" stroke="#1a1a19" stroke-width="2"/>
<text x="666" y="116" font-size="12" font-weight="600" fill="#f0efec">127.0k / 131.9k</text>
<text x="20" y="146" font-size="13" fill="#c3c2b7">Granian + Korvex app</text>
<line x1="588.5" y1="142" x2="594.5" y2="142" stroke="#383835" stroke-width="2" stroke-linecap="round"/>
<circle cx="588.5" cy="142" r="5" fill="#184f95" stroke="#1a1a19" stroke-width="2"/>
<circle cx="594.5" cy="142" r="5" fill="#9ec5f4" stroke="#1a1a19" stroke-width="2"/>
<text x="666" y="146" font-size="12" fill="#c3c2b7">121.3k / 123.1k</text>
<text x="20" y="176" font-size="13" fill="#c3c2b7">uvicorn + Korvex app</text>
<line x1="532.7" y1="172" x2="548.6" y2="172" stroke="#383835" stroke-width="2" stroke-linecap="round"/>
<circle cx="548.6" cy="172" r="5" fill="#184f95" stroke="#1a1a19" stroke-width="2"/>
<circle cx="532.7" cy="172" r="5" fill="#9ec5f4" stroke="#1a1a19" stroke-width="2"/>
<text x="666" y="176" font-size="12" fill="#c3c2b7">109.1k / 104.3k</text>
<text x="20" y="206" font-size="13" fill="#c3c2b7">Robyn</text>
<line x1="491.3" y1="202" x2="507.5" y2="202" stroke="#383835" stroke-width="2" stroke-linecap="round"/>
<circle cx="507.5" cy="202" r="5" fill="#184f95" stroke="#1a1a19" stroke-width="2"/>
<circle cx="491.3" cy="202" r="5" fill="#9ec5f4" stroke="#1a1a19" stroke-width="2"/>
<text x="666" y="206" font-size="12" fill="#c3c2b7">96.6k / 91.7k</text>
<text x="20" y="236" font-size="13" fill="#c3c2b7">FastrAPI</text>
<line x1="389.7" y1="232" x2="417.8" y2="232" stroke="#383835" stroke-width="2" stroke-linecap="round"/>
<circle cx="389.7" cy="232" r="5" fill="#184f95" stroke="#1a1a19" stroke-width="2"/>
<circle cx="417.8" cy="232" r="5" fill="#9ec5f4" stroke="#1a1a19" stroke-width="2"/>
<text x="666" y="236" font-size="12" fill="#c3c2b7">60.8k / 69.3k</text>
<text x="20" y="308" font-size="12" fill="#c3c2b7">uvicorn and Granian run the Korvex ASGI app; Robyn and FastrAPI run their own version with their own server.</text>
<text x="20" y="328" font-size="11" fill="#898781">Python 3.14.7, 11th Gen Intel(R) Core(TM) i7-11800H @ 2.30GHz</text>
