<circle cx="564.7" cy="142" r="5" fill="#9ec5f4" stroke="#1a1a19" stroke-width="2"/>
<text x="666" y="146" font-size="12" fill="#c3c2b7">106.0k / 114.0k</text>
<text x="20" y="176" font-size="13" fill="#c3c2b7">uvicorn + Korvex app</text>
<line x1="513.6" y1="172" x2="530.9" y2="172" stroke="#383835" stroke-width="2" stroke-linecap="round"/>
