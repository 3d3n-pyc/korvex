<svg xmlns="http://www.w3.org/2000/svg" width="760" height="344" viewBox="0 0 760 344" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img">
<title>Requests per second per server on the same 4 CPU cores, higher is better</title>
<desc>Korvex (built-in): 111,276 with 200 clients, 115,221 with 1,000; Granian + Korvex app: 106,003 with 200 clients, 114,032 with 1,000; uvicorn + Korvex app: 103,751 with 200 clients, 98,499 with 1,000; Robyn: 94,281 with 200 clients, 85,573 with 1,000; FastrAPI: 59,656 with 200 clients, 63,920 with 1,000.</desc>
<rect width="760" height="344" rx="8" fill="#1a1a19"/>
<text x="20" y="32" font-size="16" font-weight="600" fill="#f0efec">Requests per second on the same 4 CPU cores (higher is better)</text>
<text x="20" y="54" font-size="12" fill="#c3c2b7">Same app for all, each server with its best worker count. No request failed.</text>
<circle cx="25" cy="78" r="5" fill="#184f95"/>
<text x="35" y="82" font-size="12" fill="#c3c2b7">200 clients</text>
