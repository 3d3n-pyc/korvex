site_name: Korvex
site_description: A fast Python web framework, with a router and an HTTP server written in Rust.
site_url: https://3d3n-pyc.github.io/korvex/
repo_url: https://github.com/3d3n-pyc/korvex
repo_name: 3d3n-pyc/korvex
edit_uri: edit/main/docs/
copyright: MIT License

theme:
  name: material
  features:
    - navigation.sections
    - navigation.instant
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      toggle: {icon: material/weather-sunny, name: Light mode}

markdown_extensions:
  - admonition
  - tables
  - toc: {permalink: true}
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_root_heading: true
            show_root_full_path: false
            show_bases: false
            inherited_members: true
            show_source: false
            members_order: source
            filters: ["!^_"]
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            docstring_style: null
  - llmstxt:
      markdown_description: >
        Korvex is a fast Python web framework (ASGI), with a router and an
        HTTP server written in Rust. Handlers are plain functions whose
        parameters say what they read; validation uses msgspec or pydantic.
        Python 3.9 to 3.14, free-threaded 3.14t included. Pre-1.0: check the
        changelog for API changes.
      full_output: llms-full.txt
      sections:
        Start:
          - index.md: What Korvex is, and a first app
          - tutorial.md: Your first API, step by step, for beginners
          - glossary.md: Plain-words definitions of the terms used in the guide
        Guide:
          - routes.md: Paths, parameters, groups, hosts, url_for, static files
          - validation.md: Typed parameters, models, headers, cookies, forms, 422 errors
          - requests-and-responses.md: What a handler gets and returns
          - templates.md: HTML templates, filters, escaping, hashed static URLs
          - sessions.md: Signed-cookie sessions, flash messages, CSRF protection
          - dependencies.md: Depends, yield dependencies, overrides
          - errors-and-hooks.md: HTTPException, Abort, exception handlers, before/after hooks, startup/shutdown, app.local
          - websockets.md: WebSocket routes
          - openapi.md: OpenAPI, Swagger UI, Bearer, API keys, OAuth2, custom schemes
          - middleware.md: CORS, request IDs, rate limiting, compression, security headers
          - testing.md: TestClient and AsyncTestClient
          - server.md: The built-in server, workers and threads
          - deployment.md: nginx, Caddy, Docker, AWS Lambda, Vercel
        Reference:
          - reference/*.md
        Optional:
          - performance.md: Benchmarks
          - router.md: The standalone Rust router
          - ai.md: llms.txt, the agent skill, AGENTS.md

nav:
  - Home: index.md
  - Tutorial: tutorial.md
  - Guide:
      - Routes: routes.md
      - Validation: validation.md
      - Requests and responses: requests-and-responses.md
      - Templates: templates.md
      - Sessions and CSRF: sessions.md
      - Dependencies: dependencies.md
      - Errors and hooks: errors-and-hooks.md
      - Ready-made middleware: middleware.md
      - WebSockets: websockets.md
      - OpenAPI and security: openapi.md
      - Testing: testing.md
      - The built-in server: server.md
      - Deployment: deployment.md
      - Performance: performance.md
  - Glossary: glossary.md
  - Reference:
      - The App: reference/app.md
      - Requests: reference/requests.md
      - Responses: reference/responses.md
      - Templates: reference/templates.md
      - Parameters: reference/parameters.md
      - Errors: reference/errors.md
      - korvex.testing: reference/testing.md
      - korvex.security: reference/security.md
      - korvex.middleware: reference/middleware.md
      - korvex.router: reference/router.md
  - AI: ai.md
  - More:
      - The standalone router: router.md
      - Changelog: https://github.com/3d3n-pyc/korvex/blob/main/CHANGELOG.md
