# On a `v*` tag: build wheels for every platform, install each one in a
# fresh venv and run the tests against it, then publish to PyPI.
# Run by hand (workflow_dispatch) to build and test without publishing.
# The version comes from the tag (see .github/scripts/set_version_from_tag.py).
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 .github/scripts/set_version_from_tag.py
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      # aarch64 is cross-compiled on an x86_64 runner, so it's tested under QEMU.
      # Tests call the venv's `pytest`, not `python -m pytest`, which would
      # import the source `korvex/` folder instead of the installed wheel.
      - name: Test wheel
        if: matrix.target == 'x86_64'
        run: |
          python3 -m venv test-env
          test-env/bin/pip install --quiet dist/*.whl pytest msgspec pydantic
          test-env/bin/pytest tests/ -v
      - name: Test wheel (emulated aarch64)
        if: matrix.target == 'aarch64'
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: aarch64
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          install: |
            apt-get update -q -y
            apt-get install -q -y python3 python3-venv python3-pip
          run: |
            python3 -m venv test-env
            test-env/bin/pip install --quiet dist/*.whl pytest msgspec pydantic
            test-env/bin/pytest tests/ -v
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v7
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 .github/scripts/set_version_from_tag.py
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      - name: Test wheel
        run: |
          python3 -m venv test-env
          test-env/bin/pip install --quiet dist/*.whl pytest msgspec pydantic
          test-env/bin/pytest tests/ -v
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 .github/scripts/set_version_from_tag.py
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist
      - name: Test wheel
        shell: bash
        run: |
          python -m venv test-env
          test-env/Scripts/pip install --quiet dist/*.whl pytest msgspec pydantic
          test-env/Scripts/pytest tests/ -v
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 .github/scripts/set_version_from_tag.py
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      # Installing an sdist compiles it, so this needs Rust.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test sdist
        run: |
          python3 -m venv test-env
          test-env/bin/pip install --quiet dist/*.tar.gz pytest msgspec pydantic
          test-env/bin/pytest tests/ -v
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, macos, windows, sdist]
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing
      contents: write # GitHub release
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
      - name: Attach wheels to the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
