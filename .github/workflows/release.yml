# On a `v*` tag: build wheels for every platform, install each one in a
# fresh venv and run the tests against it, then publish to PyPI.
# Run by hand (workflow_dispatch) to build and test without publishing.
# The version comes from the tag (see .github/scripts/set_version_from_tag.py).
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    # aarch64 on GitHub's native ARM runners: built and tested like x86_64,
    # where emulating it under QEMU took minutes (and once hung in apt-get).
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - { runner: ubuntu-22.04, target: x86_64 }
          - { runner: ubuntu-24.04-arm, target: aarch64 }
    steps:
      - uses: actions/checkout@v7
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 .github/scripts/set_version_from_tag.py
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      # Tests call the venv's `pytest`, not `python -m pytest`, which would
      # import the source `korvex/` folder instead of the installed wheel.
      - name: Test wheel
        run: |
          python3 -m venv test-env
          test-env/bin/pip install --quiet dist/*.whl pytest msgspec pydantic
          test-env/bin/pytest tests/ -v
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v7
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 .github/scripts/set_version_from_tag.py
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      - name: Test wheel
        run: |
          python3 -m venv test-env
          test-env/bin/pip install --quiet dist/*.whl pytest msgspec pydantic
          test-env/bin/pytest tests/ -v
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 .github/scripts/set_version_from_tag.py
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist
      - name: Test wheel
        shell: bash
        run: |
          python -m venv test-env
          test-env/Scripts/pip install --quiet dist/*.whl pytest msgspec pydantic
          test-env/Scripts/pytest tests/ -v
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows
          path: dist

  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 .github/scripts/set_version_from_tag.py
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      # Installing an sdist compiles it, so this needs Rust.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test sdist
        run: |
          python3 -m venv test-env
          test-env/bin/pip install --quiet dist/*.tar.gz pytest msgspec pydantic
          test-env/bin/pytest tests/ -v
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  free-threaded:
    # Wheels for free-threaded Python (3.14t): the abi3 wheels above don't
    # cover it. Each is tested with -W error::RuntimeWarning, which fails if
    # a module turns the GIL back on.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - { runner: ubuntu-22.04, target: x86_64, test: true }
          - { runner: ubuntu-24.04-arm, target: aarch64, test: true }
          - { runner: macos-15-intel, target: x86_64, test: true }
          - { runner: macos-latest, target: aarch64, test: true }
          - { runner: windows-latest, target: x64, test: true }
    steps:
      - uses: actions/checkout@v7
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 .github/scripts/set_version_from_tag.py
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: 3.14t
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # On Linux the build runs in a manylinux container, which has its own 3.14t.
          args: --release --out dist -i ${{ runner.os == 'Linux' && 'python3.14t' || steps.python.outputs.python-path }}
          manylinux: ${{ runner.os == 'Linux' && 'auto' || '' }}
      - name: Test wheel
        if: matrix.test
        shell: bash
        run: |
          "${{ steps.python.outputs.python-path }}" -m venv test-env
          bin=test-env/bin; [ -d test-env/Scripts ] && bin=test-env/Scripts
          $bin/python -m pip install --quiet dist/*.whl pytest msgspec pydantic
          $bin/python -c "import sys; assert not sys._is_gil_enabled(), 'the GIL is on'"
          $bin/pytest tests/ -v -W error::RuntimeWarning
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-free-threaded-${{ runner.os }}-${{ matrix.target }}
          path: dist

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, macos, windows, sdist, free-threaded]
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing
      contents: write # GitHub release
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
      - name: Attach wheels to the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
