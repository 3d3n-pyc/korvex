name: Docs

# Builds the documentation site on every pull request (a broken link or
# reference fails it), and publishes it to GitHub Pages from main.
# The reference is read from the source: Korvex itself isn't built.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Build
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: uv run --python 3.13 --only-group docs mkdocs build --strict -d site

      - name: Upload
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
