[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "korvex"
dynamic = ["version"]
description = "A high-performance Rust-powered router for Python, with an optional ASGI layer for hosting it directly"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["router", "routing", "asgi", "rust", "pyo3", "radix-tree"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Internet :: WWW/HTTP",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/3d3n-pyc/korvex"
Issues = "https://github.com/3d3n-pyc/korvex/issues"

[project.scripts]
korvex = "korvex.cli:main"

[project.optional-dependencies]
serve = ["uvicorn>=0.30"]
redis = ["redis>=5"]
brotli = ["brotli>=1.1"]

[tool.maturin]
module-name = "korvex._core"

[dependency-groups]
# What the tests, the linters and `maturin develop` need: `uv sync` installs it.
dev = [
    "brotli>=1.2.1",
    "coverage>=7.10",
    "maturin>=1.14,<2.0",
    "msgspec>=0.20.0",
    "openapi-spec-validator>=0.7.2",
    "pre-commit>=4.0",
    "pydantic>=2.13.5",
    "pyright>=1.1.400",
    "pytest>=8.4.2",
    "redis>=7.0.1",
    "ruff>=0.14",
]
# The frameworks, servers and tools the benchmarks compare: `uv sync --group bench`.
bench = [
    "asyncpg>=0.32.0",
    "blacksheep>=2.4.2",
    "django>=4.2.30",
    "falcon>=4.4.0",
    "fastapi>=0.128.8",
    "flask>=3.1.3",
    "granian>=2.5.7",
    "litestar>=2.25.0",
    "psutil>=7.2.2",
    "pytest-benchmark>=5.2.3",
    "robyn>=0.88.0",
    "sanic>=25.3.0",
    "starlette>=0.49.3",
    "uvicorn>=0.39.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # the formatter wraps code; a long string or comment can stay
    "UP007",  # X | Y: Korvex reads handlers' annotations at runtime, and on
    "UP045",  # Python 3.9 they must be Optional[X] / Union[X, Y]
]

[tool.ruff.lint.flake8-bugbear]
# Where a parameter comes from, given as its default, as in FastAPI.
extend-immutable-calls = [
    "korvex.Cookie", "korvex.Depends", "korvex.Form", "korvex.Header", "korvex.Query",
    "korvex.params.Cookie", "korvex.params.Depends", "korvex.params.Form", "korvex.params.Header", "korvex.params.Query",
    "fastapi.Depends",  # in the benchmarks
]

[tool.ruff.lint.isort]
known-first-party = ["korvex", "taskboard"]

[tool.pyright]
include = ["korvex"]
pythonVersion = "3.9"
typeCheckingMode = "standard"

[tool.coverage.run]
source = ["korvex"]
branch = true
parallel = true
patch = ["subprocess", "fork"]  # the built-in server and the CLI run in other processes

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
