[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "korvex"
dynamic = ["version"]
description = "A high-performance Rust-powered router for Python, with an optional ASGI layer for hosting it directly"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["router", "routing", "asgi", "rust", "pyo3", "radix-tree"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Internet :: WWW/HTTP",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/3d3n-pyc/korvex"
Issues = "https://github.com/3d3n-pyc/korvex/issues"

[project.scripts]
korvex = "korvex.cli:main"

[project.optional-dependencies]
serve = ["uvicorn>=0.30"]

[tool.maturin]
module-name = "korvex._core"

[dependency-groups]
dev = [
    "blacksheep>=2.4.2",
    "django>=4.2.30",
    "falcon>=4.4.0",
    "fastapi>=0.128.8",
    "flask>=3.1.3",
    "granian>=2.5.7",
    "litestar>=2.25.0",
    "maturin>=1.14,<2.0",
    "psutil>=7.2.2",
    "pytest>=8.4.2",
    "pytest-benchmark>=5.2.3",
    "sanic>=25.3.0",
    "starlette>=0.49.3",
    "uvicorn>=0.39.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
