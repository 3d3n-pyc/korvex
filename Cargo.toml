[package]
name = "korvex"
version = "0.0.1"
edition = "2024"
description = "The Rust core of Korvex, a Python web framework: its router and HTTP server"
license = "MIT"
repository = "https://github.com/3d3n-pyc/korvex"

[lib]
name = "korvex"
crate-type = ["cdylib"]

[dependencies]
bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["http1", "server", "server-graceful", "tokio"] }
regex = "1"
rustc-hash = "2.1"
tokio = { version = "1.54.1", features = ["rt", "net", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[dependencies.pyo3]
version = "0.29.0"
features = ["extension-module", "abi3-py39"]

[lints.clippy]
all = "warn"
pedantic = "warn"
