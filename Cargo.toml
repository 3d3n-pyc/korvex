[package]
name = "korvex"
version = "0.0.1"
edition = "2024"
description = "High-performance Rust-powered router for Python"
license = "MIT"
repository = "https://github.com/3d3n-pyc/korvex"

[lib]
name = "korvex"
crate-type = ["cdylib"]

[dependencies]
rustc-hash = "2.1"

[dependencies.pyo3]
version = "0.29.0"
features = ["extension-module", "abi3-py39"]

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# New in Clippy 1.99; `assert!(x.is_empty())` reads better in tests than
# the `assert_eq!(x, [] as [T; 0])` it suggests.
assert_is_empty = "allow"
