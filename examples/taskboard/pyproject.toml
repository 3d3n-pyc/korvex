[project]
name = "taskboard"
version = "1.0.0"
description = "A shared task board, built on Korvex"
requires-python = ">=3.10"
dependencies = ["korvex>=1.0.0rc6", "msgspec>=0.18", "korbase>=0.1.0a2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["taskboard*"]

[tool.setuptools.package-data]
taskboard = ["static/*", "static/css/*", "static/js/*", "static/js/ui/*", "migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
