<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Taskboard</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/app.css">
<script type="module" src="/static/js/app.js"></script>
</head>
<body>

<!-- Icons, used as <svg><use href="#i-name"/></svg> -->
<svg xmlns="http://www.w3.org/2000/svg" hidden>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12.5A2 2 0 0 0 9 21h6a2 2 0 0 0 2-1.5L18 7M9 7V4h6v3"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-grip" viewBox="0 0 24 24"><g fill="currentColor" stroke="none"><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></g></symbol>
  <symbol id="i-notes" viewBox="0 0 24 24"><path d="M5 6.5h14M5 11.5h14M5 16.5h9"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><g fill="currentColor" stroke="none"><circle cx="5.5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18.5" cy="12" r="1.6"/></g></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6.5 10h1M10.5 10h1M14.5 10h1M17 10h.5M8 14h8"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M14 4.5h3.5A1.5 1.5 0 0 1 19 6v12a1.5 1.5 0 0 1-1.5 1.5H14M10 16l-4-4 4-4M6 12h9"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H19v15H7.5A2.5 2.5 0 0 0 5 20.5zM5 20.5A2.5 2.5 0 0 0 7.5 23H19v-5"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></symbol>
  <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3c.6 4.2 2.8 6.4 7 7-4.2.6-6.4 2.8-7 7-.6-4.2-2.8-6.4-7-7 4.2-.6 6.4-2.8 7-7zM19 16c.3 1.7 1.3 2.7 3 3-1.7.3-2.7 1.3-3 3-.3-1.7-1.3-2.7-3-3 1.7-.3 2.7-1.3 3-3z"/></symbol>
</svg>

<!-- Sign-in screen: a plain HTML form, posted to /login -->
<section id="login" class="login" hidden>
  <form class="login-card" method="post" action="/login">
    <img class="login-logo" src="/static/favicon.svg" alt="" width="52" height="52">
    <h1>Taskboard</h1>
    <p class="login-lead">Sign in to see your lists.</p>
    <input type="password" name="password" placeholder="Password" aria-label="Password" required autofocus autocomplete="current-password">
    <p id="login-failed" class="login-error" hidden>That's not the password. Try again.</p>
    <button class="button primary">Sign in</button>
  </form>
</section>

<!-- The app -->
<div id="app" class="app" hidden>
  <nav id="sidebar" class="sidebar" aria-label="Lists">
    <div class="brand"><img src="/static/favicon.svg" alt="" width="26" height="26"><span>Taskboard</span></div>

    <label class="search">
      <svg class="icon"><use href="#i-search"/></svg>
      <input id="search" type="search" placeholder="Search" aria-label="Search tasks" autocomplete="off">
      <kbd>/</kbd>
    </label>

    <ul class="nav" id="smart-views"></ul>

    <div class="nav-heading">
      <span>Lists</span>
      <button id="new-list-button" class="icon-button small" title="New list" aria-label="New list"><svg class="icon"><use href="#i-plus"/></svg></button>
    </div>
    <ul class="nav lists" id="lists"></ul>
    <form id="new-list" class="new-list" hidden>
      <span class="dot"></span>
      <input name="name" placeholder="List name" maxlength="60" aria-label="New list name" autocomplete="off">
    </form>

    <footer class="sidebar-footer">
      <span id="live" class="live" title="Live updates"><span class="dot"></span><span id="live-text">Connecting…</span></span>
      <span class="footer-actions">
        <a class="icon-button small" href="/docs" target="_blank" title="API documentation" aria-label="API documentation"><svg class="icon"><use href="#i-book"/></svg></a>
        <a class="icon-button small" href="/api/export" title="Export everything (NDJSON)" aria-label="Export"><svg class="icon"><use href="#i-download"/></svg></a>
        <button id="help-button" class="icon-button small" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts"><svg class="icon"><use href="#i-keyboard"/></svg></button>
        <form method="post" action="/logout"><button class="icon-button small" title="Sign out" aria-label="Sign out"><svg class="icon"><use href="#i-logout"/></svg></button></form>
      </span>
    </footer>
  </nav>

  <main class="main">
    <header class="main-header">
      <button id="menu-toggle" class="icon-button mobile-only" aria-label="Show lists"><svg class="icon"><use href="#i-menu"/></svg></button>
      <div class="titles">
        <h1 id="view-title"></h1>
        <p id="view-subtitle"></p>
      </div>
      <button id="list-menu-button" class="icon-button" title="List options" aria-label="List options" hidden><svg class="icon"><use href="#i-more"/></svg></button>
    </header>

    <form id="add-task" class="add-task" autocomplete="off">
      <svg class="icon add-icon"><use href="#i-plus"/></svg>
      <input id="add-title" placeholder="Add a task" maxlength="200" aria-label="New task">
      <button type="button" id="add-due" class="chip" title="Due date (click to change)"><svg class="icon"><use href="#i-calendar"/></svg><span></span></button>
    </form>

    <div id="task-area" class="task-area"></div>
  </main>

  <aside id="details" class="details" aria-label="Task details" hidden></aside>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="sidebar-backdrop" class="backdrop"></div>

</body>
</html>
